# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: ^.*/migrations/.*
repos:
-   repo: local
    hooks:
    -   id: isort
        name: isort (python)
        entry: poetry run isort
        language: system
        types: [python]
        description: "Sorts Python imports."

    -   id: black
        name: black
        entry: poetry run black
        language: system
        types: [python]
        description: "Formats Python code."

    -   id: flake8
        name: flake8
        entry: poetry run flake8
        language: system
        types: [python]
        description: "Lints Python code."

    -   id: bandit
        name: bandit
        entry: poetry run bandit -c pyproject.toml
        language: system
        types: [python]
        description: "Checks for security issues in Python code."

    -   id: pydocstringformatter
        name: pydocstringformatter
        entry: poetry run pydocstringformatter --write
        language: system
        types: [python]
        description: "Formats Python docstrings."
